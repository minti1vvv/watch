<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanachi Watch</title>
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d3d9e0;--ac:#1f4fd8;--acx:#fff;--ok:#18794e;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--panel:#18202a;--ink:#e6ebf0;--mute:#8d9aa7;--line:#2a3541;--ac:#6f95ff;--acx:#0b1220;--ok:#4cc38a;--bad:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px;font-weight:650}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
button{font:inherit;border:1px solid var(--ac);background:var(--ac);color:var(--acx);border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{font:inherit;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:220px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.on .dot{background:var(--ok)}
.meta{color:var(--mute);font-size:13px;margin-top:8px}
.err{color:var(--bad)}
</style>
</head>
<body>
<h1>Nanachi Watch <span class="meta" style="font-weight:400">v5</span></h1>

<section id="conn">
  <div class="st"><span class="dot"></span><span id="state">Не подключено</span></div>
  <div class="row">
    <button id="bConnect">Подключить часы</button>
    <button id="bDisc" class="ghost" disabled>Отключить</button>
  </div>
  <div class="meta" id="support"></div>
</section>

<section>
  <h2>Время и погода</h2>
  <div id="wx">Погода определяется по вашему местоположению.</div>
  <div class="row" style="margin-top:10px">
    <button id="bSync" class="ghost" disabled>Обновить сейчас</button>
  </div>
  <div class="meta">Всё отправляется само при подключении и каждые 30 минут, пока страница открыта.</div>
</section>

<section>
  <h2>Заметка</h2>
  <textarea id="note" placeholder="Текст заметки. Абзацы сохраняются."></textarea>
  <div class="row" style="margin-top:10px">
    <button id="bSend" disabled>Отправить на часы</button>
    <button id="bLoad" class="ghost" disabled>Загрузить с часов</button>
    <span class="meta" id="count" style="margin:0"></span>
  </div>
</section>

<div class="meta" id="log" role="status"></div>

<script>
const SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e', RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e', TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const MAX_BYTES=3900, CHUNK=100, ETX='\u0003';   // ETX - маркер конца сообщения (часы v5 его ждут)
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=new TextEncoder(), dec=new TextDecoder();
const hasBT='bluetooth' in navigator;
const ls={get:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},
          set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}};

let dev=null, rx=null, tx=null, timer=null;
let manualOff=false;   // true после нажатия «Отключить» - авто-переподключение выключено
let busy=false;        // идёт подключение/переподключение
let connected=false;

function log(msg,bad){const el=$('log');el.textContent=msg;el.className='meta'+(bad?' err':'');}

function refresh(){
  $('conn').classList.toggle('on',connected);
  $('state').textContent=connected?'Подключено: '+(dev?.name||'Nanachi-Watch'):(busy?'Подключение…':'Не подключено');
  $('bConnect').disabled=connected||busy||!hasBT;
  $('bDisc').disabled=!(connected||busy);          // во время подключения можно отменить
  ['bSync','bSend','bLoad'].forEach(id=>$(id).disabled=!connected);
}
function setUi(on){connected=on;refresh();}
function setBusy(b){busy=b;refresh();}

function withTimeout(p,ms,msg){
  let t;
  const to=new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error(msg)),ms);});
  return Promise.race([p,to]).finally(()=>clearTimeout(t));
}

// ---- Отправка на часы (все записи идут строго по очереди) ----
let sendQ=Promise.resolve();
function send(str){
  const job=sendQ.then(async()=>{
    const ch=rx;
    if(!ch) throw new Error('Нет связи с часами');
    const data=enc.encode(str+ETX);
    for(let i=0;i<data.length;i+=CHUNK){
      const part=data.slice(i,i+CHUNK);
      if(ch.writeValueWithResponse) await ch.writeValueWithResponse(part); else await ch.writeValue(part);
    }
  });
  sendQ=job.catch(()=>{});
  return job;
}

// ---- Приём заметки с часов ----
let rxBuf=[], rxNeed=-1, rxGot=0, rxTimer=null;
function rxReset(){clearTimeout(rxTimer);rxNeed=-1;rxBuf=[];rxGot=0;}
function noteDone(){
  clearTimeout(rxTimer);
  const all=new Uint8Array(rxGot); let o=0;
  for(const b of rxBuf){all.set(b,o);o+=b.length;}
  rxNeed=-1; rxBuf=[]; rxGot=0;
  $('note').value=dec.decode(all); updateCount();
  log('Заметка с часов загружена.');
}
function onNotify(e){
  const dv=e.target.value, v=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
  clearTimeout(rxTimer);
  rxTimer=setTimeout(()=>{rxReset();log('Часы не договорили заметку. Нажмите «Загрузить с часов».',true);},8000);
  if(rxNeed<0){
    const s=dec.decode(v);
    if(s.startsWith('LEN:')){rxNeed=parseInt(s.slice(4))||0;rxBuf=[];rxGot=0;if(rxNeed===0)noteDone();}
    return;
  }
  rxBuf.push(v.slice()); rxGot+=v.length;
  if(rxGot>=rxNeed) noteDone();
}
async function loadNote(){
  rxReset();
  try{log('Запрашиваю заметку…');await send('GET:');}catch(e){log('Не удалось запросить: '+e.message,true);}
}

// ---- Подключение ----
// Любой сбой внутри link() закрывает GATT: нельзя оставлять «полуоткрытую» связь,
// из-за неё часы считают себя подключёнными и перестают рекламироваться.
async function link(){
  try{
    const srv=await withTimeout(dev.gatt.connect(),15000,'таймаут подключения');
    if(manualOff) throw new Error('отменено');
    const svc=await srv.getPrimaryService(SERVICE);
    rx=await svc.getCharacteristic(RX);
    tx=await svc.getCharacteristic(TX);
    tx.addEventListener('characteristicvaluechanged',onNotify);   // слушатель - ДО startNotifications
    await tx.startNotifications();
    setUi(true);
    await sendTime(); await sleep(150);
    if(!$('note').value.trim()){await loadNote(); await sleep(150);}   // не затираем текст в поле
    try{await sendWeather();}catch(e){log('Погода: '+e.message,true);}
    if(!dev.gatt.connected) throw new Error('связь потеряна');
    clearInterval(timer);
    timer=setInterval(()=>syncAll().catch(()=>{}),30*60*1000);
  }catch(e){
    try{dev?.gatt?.disconnect();}catch(_){}
    rx=null; tx=null; clearInterval(timer); setUi(false);
    throw e;
  }
}

async function connect(){
  if(busy||connected) return;
  manualOff=false; setBusy(true);          // до первого await: окно выбора требует жеста пользователя
  try{
    if(!dev){
      dev=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
      const d=dev;
      d.addEventListener('gattserverdisconnected',()=>{ if(d===dev) onDisc(); });
    }
    for(let i=1;i<=3&&!manualOff;i++){
      try{log('Подключаюсь… '+i+' из 3');await link();return;}
      catch(e){ if(manualOff) return; if(i===3) throw e; await sleep(1500); }
    }
  }catch(e){
    log(e.name==='NotFoundError'?'Устройство не выбрано.':'Не удалось подключиться: '+e.message+'. Нажмите «Подключить часы» ещё раз.',true);
    dev=null;                               // сброс выбора: в следующий раз откроется новое окно поиска
  }finally{ setBusy(false); }
}

async function onDisc(){
  rx=null; tx=null; clearInterval(timer); rxReset(); setUi(false);
  if(manualOff||busy||!dev) return;
  setBusy(true);
  try{
    for(let i=1;i<=3&&!manualOff;i++){
      log('Связь потеряна, повтор '+i+' из 3…');
      await sleep(3000);
      if(manualOff||!dev) return;
      try{await link();return;}catch(_){}
    }
    if(!manualOff) log('Не удалось переподключиться. Нажмите «Подключить часы».',true);
  }finally{ setBusy(false); }
}

// Отключение: часы получают BYE: и сами рвут связь (надёжно даже в Chrome на Android),
// затем страховочно закрываем GATT со стороны браузера.
async function disconnect(){
  manualOff=true; clearInterval(timer);
  const d=dev;
  if(d?.gatt?.connected){
    const gone=new Promise(r=>d.addEventListener('gattserverdisconnected',r,{once:true}));
    try{ if(tx){tx.removeEventListener('characteristicvaluechanged',onNotify); await tx.stopNotifications();} }catch(_){}
    try{ if(rx) await send('BYE:'); }catch(_){}
    await Promise.race([gone,sleep(2000)]);
  }
  try{ d?.gatt?.disconnect(); }catch(_){}    // также отменяет незавершённое подключение
  rx=null; tx=null; rxReset(); setUi(false);
  log('Отключено.');
}

// ---- Время и погода (по геолокации, без ввода города) ----
const p2=n=>String(n).padStart(2,'0');
async function sendTime(){const d=new Date();await send(`TIME:${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`);}

const WX=[[0,'Ясно'],[1,'Почти ясно'],[2,'Перем. облачность'],[3,'Пасмурно'],[48,'Туман'],[57,'Морось'],[67,'Дождь'],[77,'Снег'],[82,'Ливень'],[86,'Снегопад'],[99,'Гроза']];
const wxText=c=>(WX.find(([m])=>c<=m)||[0,'—'])[1];

function gps(){return new Promise((ok,no)=>{
  if(!navigator.geolocation) return no(new Error('нет геолокации'));
  navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),e=>no(new Error(e.message)),{timeout:10000,maximumAge:1800000});
});}
async function place(){
  try{const p=await gps();ls.set('pos',JSON.stringify(p));return p;}
  catch(_){
    try{const j=await (await fetch('https://get.geojs.io/v1/ip/geo.json')).json();return {lat:+j.latitude,lon:+j.longitude};}
    catch(__){const s=ls.get('pos');if(s)return JSON.parse(s);throw new Error('не удалось определить местоположение (разрешите доступ к геолокации)');}
  }
}
async function sendWeather(){
  const pl=await place();
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&current=temperature_2m,weather_code`);
  if(!r.ok) throw new Error('сервис погоды: HTTP '+r.status);
  const c=(await r.json()).current, t=Math.round(c.temperature_2m);
  const line=`${t>0?'+':''}${t} C|${wxText(c.weather_code)}`;
  await send('WEAT:'+line);
  $('wx').textContent='На часах: '+line.replace('|',', ');
}
async function syncAll(){
  await sendTime(); await sleep(150);
  try{await sendWeather();log('Время и погода отправлены.');}
  catch(e){log('Время отправлено. Погода: '+e.message,true);}
}

// ---- Заметка ----
function updateCount(){
  const n=enc.encode($('note').value).length;
  $('count').textContent=n+' / '+MAX_BYTES+' байт';
  $('count').className='meta'+(n>MAX_BYTES?' err':'');
  ls.set('note',$('note').value);
}
async function sendNote(){
  const text=$('note').value.trim();
  if(!text) return log('Заметка пустая.',true);
  if(enc.encode(text).length>MAX_BYTES) return log('Заметка длиннее лимита, лишнее часы обрежут.',true);
  try{log('Отправляю…');await send('TEXT:'+text);log('Заметка отправлена.');}
  catch(e){log('Не удалось отправить: '+e.message,true);}
}

// ---- Запуск ----
$('note').value=ls.get('note')||'';
updateCount();
$('note').addEventListener('input',updateCount);
$('bConnect').onclick=connect;
$('bDisc').onclick=disconnect;
$('bSync').onclick=()=>syncAll().catch(e=>log(e.message,true));
$('bSend').onclick=sendNote;
$('bLoad').onclick=loadNote;
refresh();
if(!hasBT){
  $('support').textContent='Этот браузер не поддерживает Web Bluetooth. Используйте Chrome или Edge (Android, Windows, macOS). На iPhone нужен браузер Bluefy.';
  $('support').className='meta err';
}
</script>
</body>
</html>
